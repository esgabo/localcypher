# Build + deploy to apps.lan (codepilot-cl/homelab#34). Static site, no env.
when:
  - event: push
    branch: main

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.hlab.codepilot.cl
      repo: docker-registry.hlab.codepilot.cl/localcypher
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      tags: [latest, "${CI_COMMIT_SHA}"]

  deploy-apps:
    # compose-deploy:5, pinned by digest (homelab#55): a registry write must not be able to
    # swap the image that holds the deploy secrets.
    image: docker-registry.hlab.codepilot.cl/compose-deploy@sha256:7d671c3dd20122a39d1fd40b6e643cd43d3c3127eb00e9f8ddeae1c8fc6e54eb
    # settings, not environment: a plugin step is the only kind that may use
    # the image-filtered deploy secrets (homelab#62).
    settings:
      app_name: localcypher
      image: docker-registry.hlab.codepilot.cl/localcypher
      image_tag: ${CI_COMMIT_SHA}
      host_port: "8104"
      deploy_host: apps.lan
      deploy_ssh_key:
        from_secret: DEPLOY_SSH_KEY
      deploy_known_hosts:
        from_secret: DEPLOY_KNOWN_HOSTS
