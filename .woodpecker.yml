# Build + deploy to apps.lan (codepilot-cl/homelab#34). Static site, no env.
when:
  - event: push
    branch: main

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: docker-registry.hlab.codepilot.cl
      repo: docker-registry.hlab.codepilot.cl/localcypher
      username:
        from_secret: REGISTRY_USERNAME
      password:
        from_secret: REGISTRY_PASSWORD
      tags: [latest, "${CI_COMMIT_SHA}"]

  deploy-apps:
    # compose-deploy:4, pinned by digest (homelab#55): a registry write must not be able to
    # swap the image that holds the deploy secrets.
    image: docker-registry.hlab.codepilot.cl/compose-deploy@sha256:7b148862ee3bb34c9a196f219d1ae1879cf775a7d9182c99507fd96d402ae957
    environment:
      APP_NAME: localcypher
      IMAGE: docker-registry.hlab.codepilot.cl/localcypher
      IMAGE_TAG: ${CI_COMMIT_SHA}
      HOST_PORT: "8104"
      DEPLOY_HOST: apps.lan
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
      DEPLOY_KNOWN_HOSTS:
        from_secret: DEPLOY_KNOWN_HOSTS
